
name: Build Harmor Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extract project ZIP
        run: |
          mkdir source
          unzip -o HarmorAndroid_Prototype_Project.zip -d source

      - name: Build APK
        run: gradle -p source assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: HarmorAndroid-APK
          path: source/app/build/outputs/apk/debug/*.apk
